server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: cualquier ruta que no exista cae a index.html para que
  # go_router con PathUrlStrategy resuelva la ruta en cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Activos versionados por Flutter: cache largo.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No cachear el shell para que un deploy se vea de inmediato.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # gzip básico — Coolify/Traefik suele añadir brotli arriba.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    font/woff2;
}
